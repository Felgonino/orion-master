    document.getElementById('cp-medio-Piscina').className = 'pill'+(val==='Piscina'?' on':'');
    document.getElementById('cp-medio-Mar').className = 'pill'+(val==='Mar'?' on':'');
  } else if (key === 'estilo') {
    ['Libre','Espalda','Pecho','Mariposa','Combinado','Relevo'].forEach(function(e){
      var el=document.getElementById('cp-est-'+e); if(el) el.classList.toggle('on', e===val);
    });
  } else if (key === 'distancia') {
    ['50','100','200','400','800','1500','2000','3000'].forEach(function(d){
      var el=document.getElementById('cp-d-'+d); if(el) el.classList.toggle('on', d===val);
    });
  }

async function guardarCompe() {
  const tiempo = document.getElementById('cp-tiempo').value.trim();
  if (!COMPE_STATE.nadador) { toast('Selecciona el nadador'); return; }
  if (!tiempo) { toast('Ingresa el tiempo'); return; }

  const compe = {
    action: 'competencia',
    nadador: COMPE_STATE.nadador,
    medio: COMPE_STATE.medio,
    estilo: COMPE_STATE.estilo,
    distancia: COMPE_STATE.distancia,
    fecha: document.getElementById('cp-fecha').value || todayStr(),
    tiempo: tiempo,
    nombre: document.getElementById('cp-nombre').value.trim(),
    ritmo: document.getElementById('cp-ritmo').value.trim(),
    fc: document.getElementById('cp-fc').value.trim(),
    posicion: document.getElementById('cp-pos').value.trim(),
    condiciones: document.getElementById('cp-cond').value.trim()
  };

  lov(true); setLoad(50, 'Guardando competencia...', '');
  try {
    const r = await fetch('https://orion-proxy.felgonino.workers.dev', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(compe)
    });
    const j = await r.json();
    lov(false);
    if (j.ok) {
      COMPETENCIAS.push({
        Nadador:compe.nadador, Medio:compe.medio, Estilo:compe.estilo,
        Distancia:compe.distancia, Fecha:compe.fecha, Tiempo:compe.tiempo,
        Nombre:compe.nombre, Ritmo:compe.ritmo, FC:compe.fc,
        Posicion:compe.posicion, Condiciones:compe.condiciones
      });
      toast('✅ Competencia guardada');
      renderCompe();
    } else { toast('Error al guardar'); }
  } catch(e) { lov(false); toast('Error de conexión'); }
}

function filtrarGlosario(q) {
  var cats = document.getElementById('glos-cats');
  var res = document.getElementById('glos-resultados');
  if (!q || !q.trim()) {
    cats.style.display = 'block';
    res.innerHTML = '';
    return;
  }
  cats.style.display = 'none';
  var ql = q.toLowerCase();
  var matches = GLOSARIO.filter(function(g){
    return g.termino.toLowerCase().indexOf(ql) >= 0 || g.definicion.toLowerCase().indexOf(ql) >= 0;
  });
  var h = '';
  if (!matches.length) {
    h = '<div class="note">Sin resultados para "'+q+'"</div>';
  } else {
    matches.sort(function(a,b){ return a.termino.toLowerCase() < b.termino.toLowerCase() ? -1 : 1; });
    matches.forEach(function(t){
      h += '<div class="card" style="margin-bottom:8px"><div class="cb">';

}

async function guardarTermino() {
  var term = document.getElementById('gt-term').value.trim();
  var def = document.getElementById('gt-def').value.trim();
  var ejec = document.getElementById('gt-ejec').value.trim();
  if (!term || !def) { toast('Completa término y definición'); return; }
  // Evitar duplicados
  if (GLOSARIO.find(function(g){ return g.termino.toLowerCase() === term.toLowerCase(); })) {
    toast('Ese término ya existe'); return;
  }
  GLOSARIO.push({ termino:term, definicion:def, ejecucion:ejec });
  await guardarGlosarioRemoto();
  toast('✅ Término agregado');
  renderGlosario();
}

// Agrega términos nuevos detectados (desde generador) sin duplicar
function agregarTerminosGlosario(nuevos) {
  if (!nuevos || !nuevos.length) return false;
  var agregados = 0;
  nuevos.forEach(function(n){
    if (!n.termino || !n.definicion) return;
    var existe = GLOSARIO.find(function(g){ return g.termino.toLowerCase() === n.termino.toLowerCase(); });
    if (!existe) { GLOSARIO.push(n); agregados++; }
  });
  if (agregados > 0) { guardarGlosarioRemoto(); return true; }
  return false;
}

  try {
    await fetch('https://orion-proxy.felgonino.workers.dev', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'glosario', glosario: GLOSARIO })
    });
  } catch(e) { /* queda local */ }
}

// Semanas que faltan hasta una fecha (redondeado hacia arriba, mínimo 1)
function semanasHastaFecha(fechaStr) {
  if (!fechaStr) return 1;
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var f = new Date(fechaStr+'T00:00:00');
  var dias = Math.round((f - hoy) / 86400000);
  return Math.max(1, Math.ceil(dias / 7));
}

// Calcula cuántos días/semana corresponde a cada propósito en la semana `semanaNum` (1-indexed),
// interpolando linealmente entre diasIni (semana 1) y diasFin (semana = semanasObjetivo) del plan COMPLETO.
function asignacionSemana(propositos, semanaNum, semanasObjetivo) {
  var frac = semanasObjetivo > 1 ? (semanaNum - 1) / (semanasObjetivo - 1) : 1;
  if (frac > 1) frac = 1; if (frac < 0) frac = 0;
  return propositos.map(function(p){
    var ini = parseInt(p.diasIni,10) || 0, fin = parseInt(p.diasFin,10) || ini;
    var dias = Math.round(ini + (fin - ini) * frac);
    return { nombre: p.nombre || (p.medio||'Piscina'), medio: p.medio || 'Piscina', dias: dias, objetivoId: p.objetivoId };
  }).filter(function(a){ return a.dias > 0; });
}


// Motor compartido de generación: genera las semanas [desdeW..hastaW] de un plan, dado su config.
// Lo usan tanto generarPrograma() (primera tanda) como continuarPrograma() (tandas siguientes).
// cfg = { pruebasTxt, fecha, notas, semanasObjetivo, propositos, nombre }
async function generarSemanasIA(cfg, desdeW, hastaW) {
  var grupoGen = grupoActual() || 'A';
  var nadadoresGrupo = nadadoresDeGrupo();
  if (!nadadoresGrupo.length) nadadoresGrupo = NADADORES;

  var perfilesTxt = nadadoresGrupo.map(function(n){
    var d = [];
    if (n.tipo_nadador) d.push('tipo:'+n.tipo_nadador);
    if (n.edad) d.push('edad:'+n.edad);
    if (n.fortaleza) d.push('fortaleza:'+n.fortaleza);
    if (n.debilidad) d.push('a_mejorar:'+n.debilidad);
    if (n.objetivo) d.push('objetivo_tecnico:'+n.objetivo);
    if (n.t50_libre) d.push('ref_50_LIBRE_SOLO(no usar para otros estilos):'+n.t50_libre);
    if (n.t100_libre) d.push('ref_100_libre:'+n.t100_libre);
    if (n.t400_libre) d.push('ref_400_libre:'+n.t400_libre);
    if (n.swolf_ref) d.push('swolf_ref:'+n.swolf_ref);
    return n.nombre+' ['+(d.join(', ')||'sin datos de perfil aún')+']';
  }).join(' | ');

  var nombresGrupo = nadadoresGrupo.map(function(n){return n.nombre;});
  var histTxt = CACHE.filter(function(r){return r.Ritmo_100m && nombresGrupo.indexOf(r.Nadador)>=0;}).slice(-6)
    .map(function(r){return r.Nadador+':'+r.Distancia_m+'m '+r.Ritmo_100m+'/100'+(r.Medio&&r.Medio.indexOf('Piscina')<0?' ('+r.Medio.split('·')[0].trim()+')':'');}).join(', ');

  var antecTxt = '';
  nadadoresGrupo.forEach(function(n){
    var lista = ANTECEDENTES_CACHE[n.nombre] || [];
    if (lista.length) antecTxt += n.nombre+': '+lista.join('; ')+'. ';
  });

  var todasSemanas = [];
  var todosGlos = [];
  var todosAvisos = [];
  var errorGen = null;
  var totalW = hastaW - desdeW + 1;

  for (var w = desdeW; w <= hastaW; w++) {
    setLoad(Math.round(10 + (w-desdeW)/totalW*80), 'Generando semana '+w+' de '+cfg.semanasObjetivo+'...', cfg.objetivos.map(function(o){return o.nombre;}).join(' + '));

    var asign = asignacionSemana(cfg.propositos, w, cfg.semanasObjetivo);
    if (!asign.length) asign = [{nombre:'Piscina', medio:'Piscina', dias:3, objetivoId:cfg.objetivos[0].id}];

    var sesionesEnum = [];
    asign.forEach(function(a){
      for (var k=0;k<a.dias;k++) sesionesEnum.push(a);
    });
    var repartoTxt = sesionesEnum.map(function(a,idx){
      var objA = cfg.objetivos.find(function(o){ return o.id===a.objetivoId; }) || cfg.objetivos[0];
      var faltanA = objA.semanasHasta - (w-1);
      var estadoA = faltanA <= 0 ? 'objetivo ya se compitio, sesion de mantenimiento' : ('faltan '+faltanA+' semana(s) para "'+objA.nombre+'"'+(faltanA<=1?' — TAPER para este proposito':''));
      return 'Sesion '+(idx+1)+': proposito "'+a.nombre+'" (medio: '+a.medio+(a.medio==='Aguas abiertas' ? ', usa series:[] vacio, nado continuo sin estructura de pileta' : ', estructura completa 2000-3200m')+', '+estadoA+')';
    }).join('. ');

    var objetivosTxt = cfg.objetivos.map(function(o){
      var faltan = o.semanasHasta - (w-1);
      var estado = faltan <= 0 ? 'ya se compitio (semana posterior, mantenimiento)' : (faltan+' semana(s) restantes'+(faltan<=1?' — esta semana va TAPER para este objetivo (bajar volumen ~20-30%, priorizar frescura)':''));
      return '"'+o.nombre+'" ('+o.pruebasTxt+', fecha '+o.fecha+'): '+estado;
    }).join(' | ');

    var semanaPrompt =
      'Eres ORION Master, coach experto en natacion master. Genera SOLO la semana '+w+' de '+cfg.semanasObjetivo+' de un programa de entrenamiento real y de calidad, no una plantilla generica.\n' +
      (cfg.nombre ? 'NOMBRE GENERAL DEL PLAN: '+cfg.nombre+'.\n' : '') +
      'OBJETIVOS DE COMPETENCIA (cada uno con su propia fecha y estado esta semana): '+objetivosTxt+'.\n' +
      'REPARTO EXACTO DE SESIONES ESTA SEMANA (genera EXACTAMENTE estas '+sesionesEnum.length+' sesiones, una por cada linea, en este orden, respetando el estado/taper de cada objetivo indicado): '+repartoTxt+'.\n' +
      'NADADORES DE ESTE GRUPO (perfil real, usar SIEMPRE estos datos para personalizar mf/ms y ritmos objetivo, no frases genericas): '+perfilesTxt+'.\n' +
      'HISTORIAL RECIENTE: '+(histTxt||'sin historial aun')+'.\n' +
      (antecTxt?'ANTECEDENTES (aprendizajes de analisis previos que DEBEN influir el diseno): '+antecTxt+'\n':'')+
      (cfg.notas?'INDICACIONES DEL COACH: '+cfg.notas+'.\n':'')+
      '\n' +
      '=== REGLAS OBLIGATORIAS (verifica cada una antes de responder) ===\n' +
      '1. DISTANCIAS: calcula EXCLUSIVAMENTE por aritmetica de series (reps×dist), nunca adivines. Cada sesion de PISCINA (con series estructuradas) debe sumar ENTRE 2000 y 3200 METROS TOTALES (nunca mas de 3200m) sumando todos sus bloques. Verifica la suma antes de responder. Las sesiones de "Aguas abiertas" NO llevan esta restriccion (usan series:[] vacio).\n' +

      '3. DESCANSOS - coherencia obligatoria: cada serie tiene "descanso" (ENTRE REPETICIONES) y cada bloque tiene "descanso_bloque" (AL TERMINAR el bloque completo). descanso_bloque SIEMPRE debe ser >= al descanso entre repeticiones (regla practica: descanso_bloque = descanso_rep + 30seg minimo). Ademas el descanso debe ser PROPORCIONAL a la distancia: 25m -> 20-45seg, 50m -> 30-60seg (hasta 1:30 solo si es sprint maximo), 100m -> 45seg-2min, 200m+ -> 1-3min segun intensidad.\n' +

      '8. Cada bloque necesita el campo "desc": UNA FRASE CORTA (máximo 15 palabras) en lenguaje natural de que se nada ahi. Se breve, no un parrafo.\n' +
      '9. GLOSARIO: si usas algun termino tecnico que no es basico, agregalo a "glosario_nuevos" con su definicion en UNA frase breve.\n' +
      '10. BREVEDAD OBLIGATORIA en todos los campos de texto ("objetivo", "rationale", "mf", "ms"): UNA FRASE CORTA cada uno, nunca un parrafo. La prioridad es la precision de los datos numericos (series, distancias, descansos), no la extension del texto.\n\n' +
      'Devuelve SOLO JSON valido, sin backticks ni texto extra:\n' +
      '{"semana_num":'+w+',"nombre":"Semana '+w+' - foco de la semana","glosario_nuevos":[{"termino":"...","definicion":"..."}],' +
      '"sesiones":[{"id":"G'+w+'1","tipo":"A","nombre":"Sesion 1 - nombre descriptivo","dia":"Lun...","intensidad":"...","objetivo":"objetivo especifico de esta sesion","rationale":"por que esta sesion tiene esta estructura",' +
      '"bloques":[{"tipo":"Calentamiento","desc":"texto natural breve","series":[{"reps":1,"dist":300,"estilo":"Libre","implemento":"","salida":"","descanso":"30seg"}],"descanso_bloque":"40seg","mf":"meta especifica nadador 1","ms":"meta especifica nadador 2","ritmo":"Suave"},' +
      '{"tipo":"Principal","desc":"texto natural breve","series":[{"reps":5,"dist":200,"estilo":"Libre","implemento":"","salida":"2:30","descanso":""}],"descanso_bloque":"1min30seg","mf":"...","ms":"...","ritmo":"1:45/100"},' +
      '{"tipo":"Afloje","desc":"200 suave","series":[{"reps":1,"dist":200,"estilo":"Libre","implemento":"","salida":"","descanso":""}],"descanso_bloque":"","mf":"Soltar","ms":"Recuperar","ritmo":"Suave"}]}]}';

    try {
      var ctrlGen = new AbortController();
      var timeoutGen = setTimeout(function(){ ctrlGen.abort(); }, 75000);
      var resp;
      try {
        resp = await fetch('https://orion-proxy.felgonino.workers.dev',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({max_tokens:7000,messages:[{role:'user',content:semanaPrompt}]}),
          signal: ctrlGen.signal
        });
      } finally {
        clearTimeout(timeoutGen);
      }
      var data = await resp.json();
      if(!data.ok||!data.text) throw new Error(data.error||'Sin respuesta semana '+w);
      var raw=data.text.trim();
      raw = raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
      var s=raw.indexOf('{'), e2=raw.lastIndexOf('}');
      if(s<0||e2<0) throw new Error('La IA no devolvió un plan válido para la semana '+w+'. Reintenta.');
      var jsonStr = raw.substring(s,e2+1);

      try {
        semData = JSON.parse(jsonStr);

        console.error('JSON semana '+w+' malformado, intentando reparar:', parseErr.message);
        semData = repararJSONTruncado(jsonStr);
        if (!semData || !semData.sesiones || !semData.sesiones.length) {

        }

      }

      (semData.sesiones||[]).forEach(function(ses,i){
        ses.id = 'G'+w+'S'+(i+1);
        var avisos = auditarSesionGenerada(ses);
        todosAvisos = todosAvisos.concat(avisos);
      });

      todasSemanas.push({
        id: 'S'+w,
        nombre: semData.nombre || 'Semana '+w,
        sesiones: semData.sesiones || []
      });
      todosGlos = todosGlos.concat(semData.glosario_nuevos||[]);
    } catch(e) {
      errorGen = (e.name === 'AbortError')
        ? 'La semana '+w+' tardó demasiado en generarse (más de 75seg). Intenta de nuevo; si persiste, reduce días/semana.'
        : e.message;
      break;
    }
  }

  return { semanas: todasSemanas, avisos: todosAvisos, glosarioNuevos: todosGlos, errorGen: errorGen, grupo: grupoGen };
}

async function generarPrograma() {
  var nombreObj = document.getElementById('obj-nombre') ? document.getElementById('obj-nombre').value : '';
  var notas = document.getElementById('obj-notas') ? document.getElementById('obj-notas').value : '';
  OBJ.nombre=nombreObj; OBJ.notas=notas;

  if (OBJ.objetivos.some(function(o){return !o.fecha;})) { toast('Cada objetivo necesita su fecha de competencia'); return; }
  if (OBJ.objetivos.some(function(o){return !o.pruebas.length;})) { toast('Cada objetivo necesita al menos una prueba'); return; }
  if(!OBJ.propositos.length){toast('Agrega al menos un propósito de entrenamiento');return;}

  // Armar objetivos con su texto de pruebas y semanas restantes calculadas HOY (fijas para todo este programa)
  var objetivosCfg = OBJ.objetivos.map(function(o){
    return {
      id: o.id, nombre: o.nombre || o.pruebas.map(function(p){return p.dist+'m '+p.estilo;}).join('+'),
      fecha: o.fecha,
      pruebasTxt: o.pruebas.map(function(p){return p.dist+'m '+p.estilo;}).join(', '),
      semanasHasta: semanasHastaFecha(o.fecha)
    };
  });
  var semObjetivo = Math.max.apply(null, objetivosCfg.map(function(o){return o.semanasHasta;}));
  var semAhora = Math.min(parseInt(document.getElementById('obj-sem-ahora').value || '2'), semObjetivo);
  OBJ.semanasAhora = semAhora;

  var cfg = { objetivos:objetivosCfg, notas:notas, semanasObjetivo:semObjetivo, propositos:OBJ.propositos, nombre:nombreObj };
  var resumenTxt = objetivosCfg.map(function(o){return o.nombre+' ('+o.pruebasTxt+', '+o.fecha+')';}).join(' + ');

  lov(true); setLoad(10,'Generando programa...','Semana por semana');
  var r = await generarSemanasIA(cfg, 1, semAhora);
  setLoad(95,'Finalizando...','');
  lov(false);

  if (r.errorGen) {
    toast('Error semana: '+r.errorGen, 5000);
    return;
  }

  try {
    var prog = {
      id: 'GEN'+Date.now(),
      nombre: nombreObj || resumenTxt,
      subtitulo: resumenTxt,
      fechaFin: objetivosCfg[objetivosCfg.length-1].fecha,
      color: '#CA6F1E',
      activo: false,
      grupo: r.grupo,
      semanas: r.semanas,
      semanasObjetivo: semObjetivo,
      configGen: cfg
    };

    var glosAdd = agregarTerminosGlosario(r.glosarioNuevos);
    PROGRAMAS_GEN.push(prog);
    if (r.avisos.length) {
      console.warn('Avisos de generación:', r.avisos);
      toast('Programa generado con '+r.avisos.length+' aviso(s) — revisa antes de usar', 5000);
    } else {
      toast(glosAdd ? 'Programa generado (glosario actualizado)' : 'Programa generado ✓ sin advertencias');
    }
    PROG_AVISOS = r.avisos;
    renderObjetivos();
  } catch(e) {
    console.error('Error post-generación:', e);
    toast('El programa se generó pero hubo un error al mostrarlo: '+e.message, 6000);
  }
}

// Continúa un programa ya generado/activado: genera el siguiente lote de semanas (hasta 2 a la vez,
// para minimizar riesgo de cortes) usando los resultados y antecedentes YA CARGADOS desde que empezó el plan.
async function continuarPrograma(progOrBloqueId, esActivado) {
  var prog = esActivado ? BLOQUES.find(function(b){return b.id===progOrBloqueId;}) : PROGRAMAS_GEN[progOrBloqueId];
  if (!prog || !prog.configGen) { toast('No se encontró la configuración de este programa'); return; }

  var desdeW = prog.semanas.length + 1;
  var semObjetivo = prog.semanasObjetivo || prog.configGen.semanasObjetivo;
  if (desdeW > semObjetivo) { toast('Este programa ya tiene todas sus semanas generadas'); return; }
  var hastaW = Math.min(desdeW + 1, semObjetivo);

  lov(true); setLoad(10,'Continuando programa...','Semana '+desdeW+' en adelante');
  var r = await generarSemanasIA(prog.configGen, desdeW, hastaW);
  setLoad(95,'Finalizando...','');
  lov(false);

  if (r.errorGen) {
    toast('Error al continuar: '+r.errorGen, 5000);
    return;
  }

  prog.semanas = prog.semanas.concat(r.semanas);
  var glosAdd = agregarTerminosGlosario(r.glosarioNuevos);
  if (r.avisos.length) {
    toast('Continuado con '+r.avisos.length+' aviso(s) — revisa antes de usar', 5000);
  } else {
    toast('Programa continuado ✓ ('+r.semanas.length+' semana(s) nueva(s))');
  }
  PROG_AVISOS = r.avisos;
  if (esActivado) { renderPlan(); }
  renderObjetivos();
}
var PROG_AVISOS = [];


function activarProgramaGen(i) {
  var prog=PROGRAMAS_GEN[i];
  BLOQUES.forEach(function(b){b.activo=false;});
  prog.activo=true;
  if(!BLOQUES.find(function(b){return b.id===prog.id;})) BLOQUES.push(prog);
  toast('Programa activado en Plan');
  goTab('plan');
}

function imprimirSesion(id) {
  var s=BLOQUES.flatMap(function(b){return b.semanas.flatMap(function(w){return w.sesiones;});}).find(function(x){return x.id===id;});
  if(!s){toast('Sesión no encontrada');return;}
  var di=calcDistSesion(s), tot=di?di.total+'m':'';

  // Build WhatsApp text summary
  var waTxt = 'ORION Master - '+s.nombre+'\n'+s.dia+(tot?' | '+tot:'')+'\nObjetivo: '+s.objetivo+'\n\n';
  s.bloques.forEach(function(b,i){
    var dB=calcDistBloque(b);
    waTxt+=(i+1)+'. '+b.tipo+(dB?' ('+dB+'m)':'')+'\n';
    if(b.series&&b.series.length){
      b.series.forEach(function(sr){
        var t=(sr.reps>1?sr.reps+'x'+sr.dist+'m':sr.dist+'m')+' '+sr.estilo;
        if(sr.implemento)t+=' ('+sr.implemento+')';
        if(sr.salida)t+=' @'+sr.salida;
        if(sr.descanso)t+=' desc.'+sr.descanso;
        waTxt+='   - '+t+'\n';
      });
    } else if(b.desc||fmtEstructura(b)) waTxt+='   '+(b.desc||fmtEstructura(b))+'\n';
    if(b.ritmo)waTxt+='   Ritmo: '+b.ritmo+'\n';
    waTxt+='\n';
  });
  if(tot)waTxt+='Total: '+tot;
  var waUrl='https://wa.me/?text='+encodeURIComponent(waTxt);

  // Build PDF HTML - everything escaped to not break script
  var p=[];
  p.push('<!DOCTYPE html><html><head><meta charset="UTF-8">');
  p.push('<title>ORION - '+s.nombre+'<\/title>');
  p.push('<style>');
  p.push('*{box-sizing:border-box;margin:0;padding:0}');
  p.push('body{font-family:Arial,sans-serif;font-size:13pt;color:#1B2631;padding:10mm 12mm}');
  p.push('@media print{@page{size:letter portrait;margin:8mm 10mm}.no-print{display:none!important}body{font-size:12pt;padding:0}}');
  p.push('.no-print{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}');
  p.push('button{padding:8px 16px;border:none;border-radius:7px;font-size:12pt;cursor:pointer}');
  p.push('.badge{background:#0D2B55;color:#fff;display:inline-block;padding:2px 10px;border-radius:4px;font-size:10pt;font-weight:700;letter-spacing:1px;margin-bottom:4px}');
  p.push('h1{font-size:17pt;color:#0D2B55;margin:3px 0 2px;line-height:1.2}');
  p.push('.meta{font-size:11pt;color:#666;margin-bottom:7px}');
  p.push('.obj{background:#EBF5FB;border-left:4px solid #0D2B55;padding:7px 11px;border-radius:3px;margin-bottom:8px;font-size:12pt;line-height:1.3}');
  p.push('.blq{border:1.5px solid #BDC3C7;border-radius:6px;margin-bottom:8px;page-break-inside:avoid}');
  p.push('.bh{background:#D6EAF8;padding:6px 11px;font-size:13pt;font-weight:700;color:#0D2B55;border-radius:4px 4px 0 0;display:flex;justify-content:space-between;align-items:center}');
  p.push('.bb{padding:6px 11px}');
  p.push('.ser{font-size:13pt;padding:4px 0;border-bottom:1px solid #EEE;line-height:1.4}');
  p.push('.ser:last-child{border-bottom:none}');
  p.push('.rtag{background:#0D2B55;color:#fff;border-radius:3px;padding:1px 8px;font-size:11pt;font-weight:700}');
  p.push('.sd{font-size:11pt;color:#5D6D7E;margin-left:5px}');
  p.push('.desc-b{font-size:11pt;color:#888;font-style:italic;margin-top:4px}');
  p.push('.tot{text-align:right;font-size:14pt;font-weight:700;color:#0D2B55;margin-top:8px;border-top:2.5px solid #0D2B55;padding-top:7px}');
  p.push('.foot{margin-top:10px;font-size:10pt;color:#AAA;text-align:center;border-top:1px solid #EEE;padding-top:6px}');
  p.push('<\/style><\/head><body>');

  // Action buttons
  p.push('<div class="no-print">');
  p.push('<button style="background:#0D2B55;color:#fff" onclick="window.print()">&#x1F5A8; Imprimir \/ Guardar PDF<\/button>');
  p.push('<button style="background:#25D366;color:#fff" onclick="window.open(\''+waUrl+'\')">&#x1F4F1; WhatsApp<\/button>');
  p.push('<button style="background:#E5E8E8;color:#333" onclick="window.close()">&#x2715; Cerrar<\/button>');
  p.push('<\/div>');

  // Header
  p.push('<div class="badge">ORION MASTER<\/div>');
  p.push('<h1>'+s.nombre+'<\/h1>');
  p.push('<div class="meta">'+s.dia+(tot?' &bull; '+tot:'')+(s.intensidad?' &bull; '+s.intensidad:'')+'<\/div>');
  p.push('<div class="obj"><b>Objetivo:<\/b> '+s.objetivo+'<\/div>');

  // Bloques with full detail
  s.bloques.forEach(function(b,i){
    var dB=calcDistBloque(b);
    p.push('<div class="blq">');

    p.push('<div class="bb">');
    if(b.series&&b.series.length){
      b.series.forEach(function(sr){
        p.push('<div class="ser">');

      p.push('<div class="ser">'+(b.desc||fmtEstructura(b))+'<\/div>');
    }
    if(b.descanso_bloque&&b.descanso_bloque!=='—'){
      p.push('<div class="desc-b">&#x23F8; Descanso entre bloques: '+b.descanso_bloque+'<\/div>');
    }
    p.push('<\/div><\/div>');
  });

  if(tot)p.push('<div class="tot">Distancia total: '+tot+'<\/div>');
  p.push('<div class="foot">ORION Master &bull; '+new Date().toLocaleDateString('es-CL')+'<\/div>');
  p.push('<\/body><\/html>');

  var v=window.open('','_blank','width=880,height=800');
  if(v){v.document.write(p.join(''));v.document.close();}
  else toast('Permite ventanas emergentes para imprimir',3000);
}

// Cargar nadadores y competencias desde Sheets, luego mostrar login
async function cargarNadadores() {
  var ctrl1 = new AbortController();
  var t1 = setTimeout(function(){ ctrl1.abort(); }, 8000);
  try {
    const r = await fetch('https://orion-proxy.felgonino.workers.dev?tipo=nadadores&t='+Date.now(), {signal:ctrl1.signal});
    clearTimeout(t1);
    const j = await r.json();
    if (j.ok && j.nadadores && j.nadadores.length) {
      NADADORES = j.nadadores;
    }
  } catch(e) { clearTimeout(t1); /* usa los por defecto */ }
  // Cargar glosario
  var ctrl2 = new AbortController();
  var t2 = setTimeout(function(){ ctrl2.abort(); }, 8000);
  try {
    const rg = await fetch('https://orion-proxy.felgonino.workers.dev?tipo=glosario&t='+Date.now(), {signal:ctrl2.signal});
    clearTimeout(t2);
    const jg = await rg.json();
    if (jg.ok && jg.glosario && jg.glosario.length) {
      jg.glosario.forEach(function(g){
        if (!GLOSARIO.find(function(x){ return x.termino.toLowerCase() === (g.termino||'').toLowerCase(); })) {
          GLOSARIO.push(g);
        }
      });
    }
  } catch(e) { clearTimeout(t2); /* usa los base */ }
}

async function initApp() {
  // Mostrar el login PRIMERO con los nadadores por defecto (no bloquear por la red)
  renderLogin();
  // Luego cargar datos del servidor en segundo plano y refrescar
  cargarNadadores().then(function(){
    renderLogin(); // refrescar por si llegaron nadadores actualizados del servidor
  }).catch(function(){});
  // Cargar datos en background
  sheetsLoad().then(()=>{
    const tab=document.querySelector('.tab.on')?.id?.replace('tab-','');
    if(tab==='plan'&&USUARIO_ACTUAL) renderPlan();
    if(tab==='historial'&&USUARIO_ACTUAL) renderHistorial();
  }).catch(()=>syncDot('err'));
  cargarAntecedentes();
}

initApp();
